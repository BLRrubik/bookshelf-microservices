services:
  # Auth Service Database
  auth-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./auth-service/migrations:/docker-entrypoint-initdb.d:ro
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Books Service Database
  books-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: books
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./books-service/migrations:/docker-entrypoint-initdb.d:ro
      - books_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for caching and rate limiting
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Auth Service
  auth-service:
    build: ./auth-service
    environment:
      PORT: ":8081"
      DATABASE_URL: "postgres://postgres:postgres@auth-postgres:5432/auth?sslmode=disable"
      JWT_SECRET: "secret"
      SERVICE_KEY: "serviceKey"
      LOG_LEVEL: "info"
    depends_on:
      auth-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Books Service
  books-service:
    build: ./books-service
    environment:
      PORT: ":8082"
      DATABASE_URL: "postgres://postgres:postgres@books-postgres:5432/books?sslmode=disable"
      AUTH_SERVICE_URL: "http://auth-service:8081"
      SERVICE_KEY: "serviceKey"
      LOG_LEVEL: "info"
    depends_on:
      books-postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Worker Service (cover processing)
  worker-service:
    build: ./worker-service
    environment:
      PORT: ":8083"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      MINIO_URL: "minio:9000"
      MINIO_PUBLIC_ENDPOINT: "http://localhost:9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS: "minioadmin"
      MINIO_SECRET: "minioadmin"
      MINIO_BUCKET: "bookshelf-covers"
      DATABASE_URL: "postgres://postgres:postgres@books-postgres:5432/books?sslmode=disable"
      LOG_LEVEL: "info"
    depends_on:
      books-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  # API Gateway — единственный сервис, доступный извне
  api-gateway:
    build: ./api-gateway
    ports:
      - "8000:8000"
    environment:
      PORT: ":8000"
      AUTH_SERVICE_URL: "http://auth-service:8081"
      BOOKS_SERVICE_URL: "http://books-service:8082"
      REDIS_URL: "redis://redis:6379"
      SERVICE_KEY: "serviceKey"
      LOG_FORMAT: "text"
      APP_VERSION: "1.0.0"
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      books-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Frontend Application
  frontend:
    build: ./frontend
    ports:
      - "5176:80"
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  auth_postgres_data:
  books_postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
